name: Sync Fork with Upstream

on:
  schedule:
    # 每天 UTC 时间 00:00 运行（北京时间早上 8 点）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event.repository.fork # 确保只在 fork 仓库中运行
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main # 你 fork 仓库的主分支名，如果是 master 请改为 master

      - name: Sync Upstream
        uses: aormsby/fork-sync-with-upstream-action@v3.4.3
        with:
          # ⚠️ 注意：这里必须改成原作者的用户名和仓库名，例如：vuejs/core
          upstream_repository: 原作者名/原仓库名
          upstream_branch: main
          target_branch: main # 你的仓库主分支名
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
